name: 🚀 Auto Deploy via FTP (Separate Backend & Public)

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build-and-deploy:
    name: 🏗️ Build & Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Next.js Application (Standalone Mode)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 📂 Assemble Deployment Artifacts
        run: |
          echo "Memulai persiapan paket deployment terpisah..."
          
          # Bersihkan direktori staging jika ada
          rm -rf deploy_dist
          mkdir -p deploy_dist/backend
          mkdir -p deploy_dist/public

          # -------------------------------------------------------------
          # 1. RAKIT BACKEND (/home/pang8694/portfolio_backend)
          # -------------------------------------------------------------
          # Salin SEMUA file hasil build standalone Next.js termasuk folder tersembunyi .next
          cp -r .next/standalone/. deploy_dist/backend/
          
          # HAPUS node_modules agar TIDAK ter-upload oleh CI/CD (diupload/diinstall manual oleh user)
          rm -rf deploy_dist/backend/node_modules

          # Pastikan .next standalone dan static tersalin lengkap (termasuk BUILD_ID dan server bundle)
          mkdir -p deploy_dist/backend/.next
          cp -r .next/standalone/.next/* deploy_dist/backend/.next/ 2>/dev/null || true
          cp -r .next/static deploy_dist/backend/.next/
          cp -r public deploy_dist/backend/

          # Salin entrypoint universal cPanel Phusion Passenger, package-lock, & skrip database
          cp app.js deploy_dist/backend/
          cp loader.cjs deploy_dist/backend/
          cp package-lock.json deploy_dist/backend/
          mkdir -p deploy_dist/backend/database deploy_dist/backend/scripts
          cp -r database/* deploy_dist/backend/database/
          cp scripts/migrate.js deploy_dist/backend/scripts/
          cp .env.production.example deploy_dist/backend/

          # -------------------------------------------------------------
          # 2. RAKIT PUBLIC (/home/pang8694/public_html)
          # -------------------------------------------------------------
          # Salin semua asset dari public/
          cp -r public/* deploy_dist/public/
          
          # Salin Next.js static chunks langsung ke public_html/_next/static
          # Memungkinkan Apache/LiteSpeed menyajikan file JS/CSS secara instan tanpa beban Node.js
          mkdir -p deploy_dist/public/_next
          cp -r .next/static deploy_dist/public/_next/

          # Salin .htaccess sebagai jembatan penghubung public_html ke portfolio_backend
          cp public/.htaccess deploy_dist/public/.htaccess

          echo "✅ Struktur file berhasil dirakit (tanpa node_modules):"
          echo "=== Backend Structure (/home/pang8694/portfolio_backend) ==="
          ls -la deploy_dist/backend
          echo "=== Public Structure (/home/pang8694/public_html) ==="
          ls -la deploy_dist/public

      - name: 🧹 Parse & Sanitize FTP Host
        id: ftp_cfg
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*//||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          
          RAW_PORT="${{ secrets.FTP_PORT }}"
          PORT=$(echo "$RAW_PORT" | tr -cd '0-9')
          if [ -z "$PORT" ]; then PORT="21"; fi
          
          echo "server=$SERVER" >> $GITHUB_OUTPUT
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "FTP Target Host: $SERVER"
          echo "FTP Target Port: $PORT"

      - name: 🔍 Test FTP Connection Reachability
        run: |
          SERVER="${{ steps.ftp_cfg.outputs.server }}"
          PORT="${{ steps.ftp_cfg.outputs.port }}"
          echo "Menguji koneksi TCP ke $SERVER pada port $PORT..."
          if nc -z -v -w 15 "$SERVER" "$PORT"; then
            echo "✅ Server FTP $SERVER pada port $PORT dapat dijangkau!"
          else
            echo "::warning::Koneksi TCP ke $SERVER:$PORT timeout. Jika menggunakan Cloudflare, pastikan DNS record FTP diset ke DNS Only (Awan Abu-abu) atau gunakan IP langsung server hosting sebagai FTP_SERVER di GitHub Secrets."
          fi

      - name: 🚀 Deploy Backend to /home/pang8694/portfolio_backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_cfg.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ steps.ftp_cfg.outputs.port }}
          timeout: 300000
          security: loose
          log-level: verbose
          local-dir: ./deploy_dist/backend/
          server-dir: portfolio_backend/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: 🚀 Deploy Public to /home/pang8694/public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_cfg.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ steps.ftp_cfg.outputs.port }}
          timeout: 300000
          security: loose
          log-level: verbose
          local-dir: ./deploy_dist/public/
          server-dir: public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
